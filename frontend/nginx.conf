server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Notification scans can be slow on cold start (model warmup + network I/O).
        # Avoid returning nginx HTML 502/504 pages to the SPA; wait longer for upstream.
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # Stream responses promptly (avoid buffering large JSON responses).
        proxy_buffering off;

        # Return JSON (not HTML) when upstream is unavailable.
        proxy_intercept_errors on;
        error_page 502 503 504 = /_api_error.json;
    }

    location = /_api_error.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 503 '{"detail":"Backend temporarily unavailable (starting up or busy). Please retry in a few seconds."}';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
