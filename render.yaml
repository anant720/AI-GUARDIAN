services:
  # ── AI Guardian FastAPI Backend ──────────────────────────────────────────────
  - type: web
    name: ai-guardian-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: APP_NAME
        value: AI_GUARDIAN
      - key: APP_ENV
        value: production
      - key: GROQ_API_KEY_1
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: LLM_MODE
        value: auto
      - key: LLM_TIMEOUT_SECONDS
        value: "25"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRE_HOURS
        value: "12"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-guardian-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: FINETUNE_DRY_RUN
        value: "true"
      - key: RETRAIN_SCHEDULER_ENABLED
        value: "false"

  # ── PostgreSQL Database ───────────────────────────────────────────────────────
databases:
  - name: ai-guardian-db
    plan: free
